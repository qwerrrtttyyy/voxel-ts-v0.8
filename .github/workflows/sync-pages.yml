name: Sync Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # --base=./ 让产物用相对路径，适配 https://<user>.github.io/<repo>/ 子路径部署
      - name: Build
        run: npx vite build --base=./

      - name: Make plugin URL relative
        run: sed -i 's#value="/plugins/#value="./plugins/#' dist/index.html

      - name: Push site to gh-pages
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c commit.gpgsign=false commit -q -m "chore: sync Pages preview from ${GITHUB_SHA::7}"
          # 显式 refspec：只更新远端 gh-pages 分支，绝不触碰 main
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/gh-pages
